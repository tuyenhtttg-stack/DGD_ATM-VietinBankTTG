<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>In mã QR ATM – VietinBank Tây Tiền Giang</title>
<link rel="icon" href="icons/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#005993;--red:#D71249;--muted:#5D6F82;--hoa-no:linear-gradient(100deg,#1BA9E1 0%,#12C2EE 32%,#0A7FB8 48%,#005993 58%,#3D4E86 66%,#8B3A5E 76%,#D71249 90%,#C21F2C 100%)}
  *{box-sizing:border-box}
  body{margin:0;font-family:"SVN-Gilroy","Be Vietnam Pro",system-ui,sans-serif;color:#0C2A44;background:#EEF4F9}
  .bar{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:2}
  .bar h1{font-size:16px;margin:0 auto 0 0;color:var(--blue)}
  .bar label{font-size:13px;display:flex;gap:6px;align-items:center}
  .bar button{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);padding:8px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px;max-width:1100px;margin:0 auto}
  .card{background:#fff;border-radius:14px;overflow:hidden;text-align:center;border:1px solid #DCE6EE;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column}
  .card .top{padding:14px 14px 0;display:flex;justify-content:flex-end}
  .card .top img{height:38px}
  .card .ttl{font-weight:700;color:var(--blue);font-size:15px;padding:10px 14px 2px;line-height:1.3}
  .card .addr{font-size:11.5px;color:var(--muted);padding:0 14px;line-height:1.4;min-height:32px}
  .card .qr{padding:10px 0 4px}
  .card .qr svg{width:170px;height:170px;display:block;margin:0 auto}
  .card .cta{font-size:12.5px;font-weight:600;padding:2px 14px 12px}
  .card .cta b{color:var(--red)}
  .card .strip{height:6px;background:var(--hoa-no);margin-top:auto}
  .empty{text-align:center;color:var(--muted);padding:40px}
  @media print{
    @page{size:A4;margin:10mm}
    body{background:#fff}
    .bar,.hint{display:none}
    .grid{grid-template-columns:repeat(3,1fr);padding:0;gap:8mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="bar">
  <h1>In mã QR dán tại ATM / điểm giao dịch</h1>
  <label><input type="checkbox" id="incPgd"> Gồm điểm giao dịch</label>
  <button onclick="print()">In / Lưu PDF</button>
</div>
<div class="hint">Mỗi mã QR mở thẳng bản đồ tại đúng ATM đó. Khổ in A4, 3 thẻ mỗi hàng. Trang này không hiển thị trên giao diện khách hàng.</div>
<div class="grid" id="grid"><div class="empty">Đang tải dữ liệu…</div></div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="lib.js"></script>
<script>
(async () => {
  const CFG = window.APP_CONFIG || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const base = location.origin + location.pathname.replace(/qr\.html$/, '');
  const [a, p] = await Promise.all([VTB.loadKind('atm'), VTB.loadKind('pgd')]);
  const inc = document.getElementById('incPgd');
  function render(){
    const items = a.items.concat(inc.checked ? p.items : []);
    document.getElementById('grid').innerHTML = items.length ? items.map(it => {
      const url = `${base}?${it.kind}=${encodeURIComponent(it.id)}`;
      const q = qrcode(0, 'M'); q.addData(unescape(encodeURIComponent(url))); q.make();
      return `<div class="card">
        <div class="top"><img src="${esc(CFG.LOGO || 'assets/logo.png')}" alt="VietinBank Tây Tiền Giang"></div>
        <div class="ttl">${esc(it.name)}</div>
        <div class="addr">${esc(it.address)}</div>
        <div class="qr">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
        <div class="cta">Quét mã để <b>xem bản đồ</b> và chỉ đường</div>
        <div class="strip"></div>
      </div>`;
    }).join('') : '<div class="empty">Chưa có dữ liệu.</div>';
  }
  inc.onchange = render; render();
})();
</script>
</body>
</html>
