<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tìm ATM VietinBank – Chi nhánh Tây Tiền Giang</title>
<meta name="description" content="Bản đồ ATM, CDM và điểm giao dịch VietinBank Chi nhánh Tây Tiền Giang. Tìm ATM gần bạn và chỉ đường bằng Google Maps.">
<meta name="theme-color" content="#005993">
<meta property="og:title" content="Tìm ATM VietinBank – Chi nhánh Tây Tiền Giang">
<meta property="og:description" content="Tìm ATM gần bạn nhất và chỉ đường ngay bằng Google Maps.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATM VietinBank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="brand-strip" aria-hidden="true"></div>
<div id="map" aria-label="Bản đồ ATM"></div>

<!-- Thanh trên: tiêu đề, logo, tìm kiếm, bộ lọc -->
<header class="topbar" id="topbar">
  <div class="appbar">
    <div class="appbar-row">
      <div class="titles">
        <h1 id="appTitle">Tìm ATM VietinBank</h1>
        <div class="sub" id="branchName">Chi nhánh Tây Tiền Giang</div>
      </div>
      <div class="logo-wrap">
        <img id="logo" class="logo" alt="VietinBank Chi nhánh Tây Tiền Giang">
        <span id="logoText" class="logo-text" hidden>VietinBank<br><small>Tây Tiền Giang</small></span>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Tìm theo tên, địa chỉ, xã/phường…" autocomplete="off" enterkeyhint="search">
      <button id="qClear" class="icon-btn sm" type="button" aria-label="Xóa tìm kiếm" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
  </div>
  <nav class="chips" id="chips" aria-label="Bộ lọc">
    <div class="seg" role="tablist">
      <button role="tab" data-tab="atm" aria-selected="true">ATM</button>
      <button role="tab" data-tab="pgd" aria-selected="false">Điểm giao dịch</button>
    </div>
    <button class="chip" data-filter="cdm" aria-pressed="false">Nạp tiền (CDM)</button>
    <button class="chip" data-filter="h24" aria-pressed="false">24/7</button>
    <button class="chip" data-filter="active" aria-pressed="false">Đang hoạt động</button>
  </nav>
</header>

<!-- Nút định vị -->
<button id="locateBtn" class="fab" type="button" aria-label="Vị trí của tôi">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
</button>

<!-- Bảng trượt: danh sách / chi tiết -->
<section class="sheet" id="sheet" aria-label="Danh sách ATM">
  <div class="sheet-head" id="sheetHead">
    <div class="handle" aria-hidden="true"></div>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div id="listView"></div>
    <div id="detailView" hidden></div>
  </div>
</section>

<!-- Hộp thoại mã QR -->
<dialog id="qrDialog" class="qr-dialog">
  <form method="dialog" class="qr-inner">
    <button class="icon-btn qr-close" value="close" aria-label="Đóng">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="qr-title" id="qrTitle"></div>
    <div class="qr-sub">Quét mã để mở bản đồ và chỉ đường</div>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-actions">
      <button type="button" class="btn btn-primary" id="qrDownload">Tải ảnh mã QR</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
